name: CI — Test & Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 core/ src/ scripts/ \
            --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=__pycache__,archive,venv,.git

      - name: Compile-check all modules
        run: |
          python -c "
          import py_compile, sys
          from pathlib import Path
          ok = 0
          fail = 0
          for f in Path('.').rglob('*.py'):
              if any(p in str(f) for p in ['archive', 'venv', '__pycache__', '.git', 'MQL5', 'Bases']):
                  continue
              try:
                  py_compile.compile(str(f), doraise=True)
                  ok += 1
              except py_compile.PyCompileError:
                  fail += 1
                  print(f'FAIL: {f}', file=sys.stderr)
          print(f'{ok} OK, {fail} FAIL')
          sys.exit(0 if fail == 0 else 1)
          "

      - name: Run tests (unit only, skip MT5 integration)
        run: |
          python -m pytest tests/ \
            -v \
            --ignore=tests/test_mt5_ai_service_safe_fallback.py \
            --ignore=tests/test_mt5_ai_service_socket_protocol.py \
            --ignore=tests/test_mt5_ai_service_strategy_gate.py \
            --ignore=tests/test_request_correlation_hardening.py \
            -k "not xm_gold_live and not xm_gold_dry and not xm_gold_manual" \
            --timeout=120 \
            --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t xm-mt5-ai .
