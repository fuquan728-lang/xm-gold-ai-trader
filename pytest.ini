[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
addopts = -q
norecursedirs =
    .git
    .pytest_cache
    __pycache__
    archive
    legacy
    tests/legacy
    legacy_v4
    venv
    .venv
    Bases
    MQL5
    Profiles
    Config
